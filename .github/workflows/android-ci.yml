name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The Google Services plugin requires app/google-services.json to exist, but the real
      # file (with production Firebase keys) is gitignored and never committed. This generates
      # a throwaway placeholder with just enough shape to satisfy the plugin so CI can build and
      # run unit tests/lint without touching any real Firebase project.
      - name: Write placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "studentcompanion-ci",
              "storage_bucket": "studentcompanion-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.studentcompanion.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
